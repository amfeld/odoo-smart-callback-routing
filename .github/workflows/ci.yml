name: CI

on:
  push:
    branches: [v19]
  pull_request:
    branches: [v19]

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the job inside the official Odoo Community image — no docker-in-docker,
    # no host networking. The postgres service is reachable as hostname "db".
    container:
      image: odoo:19
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install & test the module on Odoo 19 (Community)
        run: |
          odoo -d ci_test -i smart_callback_routing \
            --test-enable --test-tags /smart_callback_routing \
            --stop-after-init --without-demo \
            --db_host db --db_user odoo --db_password odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE" \
            2>&1 | tee /tmp/odoo-ci.log

      - name: Assert test result
        run: grep -E "odoo\.tests\.result: 0 failed, 0 error" /tmp/odoo-ci.log
